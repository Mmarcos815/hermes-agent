# Crontab entries for my 1st project automation
# Install with: crontab crontab.conf

# Daily sync to OneDrive — 2:00 AM every day
0 2 * * * /bin/bash $HOME/orca/projects/my\ 1st/automation/daily_sync.sh

# Weekly vulnerability scan — Sunday 3:00 AM
0 3 * * 0 /bin/bash $HOME/orca/projects/my\ 1st/automation/weekly_scan.sh

# Monthly PDF report — 1st of month at 4:00 AM
0 4 1 * * /bin/bash $HOME/orca/projects/my\ 1st/automation/monthly_report.sh
