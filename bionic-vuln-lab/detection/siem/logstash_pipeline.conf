# Bionic Vuln Lab - Logstash Pipeline for Attack Log Ingestion
# Parses attack logs and sends to Elasticsearch

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # Parse JSON attack logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "attack"
      skip_on_invalid_json => true
    }
  }

  # If JSON parsing succeeded, promote fields
  if [attack] {
    mutate {
      rename => {
        "[attack][@timestamp]" => "@timestamp"
        "[attack][source_ip]" => "source_ip"
        "[attack][target]" => "target"
        "[attack][target_port]" => "target_port"
        "[attack][attack_type]" => "attack_type"
        "[attack][severity]" => "severity"
        "[attack][severity_score]" => "severity_score"
        "[attack][payload]" => "payload"
        "[attack][protocol]" => "protocol"
        "[attack][http_method]" => "http_method"
        "[attack][url]" => "url"
        "[attack][user_agent]" => "user_agent"
        "[attack][country]" => "country"
        "[attack][city]" => "city"
        "[attack][geo_location]" => "geo_location"
        "[attack][action_taken]" => "action_taken"
        "[attack][signature_id]" => "signature_id"
      }
      remove_field => ["attack", "message"]
    }
  }

  # Ensure timestamp is properly set
  if [@timestamp] == "1970-01-01T00:00:00.000Z" or ![@timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  # Convert severity_score to integer
  if [severity_score] {
    mutate {
      convert => {
        "severity_score" => "integer"
        "target_port" => "integer"
      }
    }
  }

  # GeoIP enrichment for source IP
  if [source_ip] and [source_ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.)/ {
    geoip {
      source => "source_ip"
      target => "geoip"
      database => "/usr/share/GeoIP/GeoLite2-City.mmdb"
      default_database_type => "City"
      fields => ["CITY_NAME", "COUNTRY_NAME", "LOCATION", "REGION_NAME"]
    }
  }

  # Add environment tags
  mutate {
    add_field => {
      "environment" => "bionic-vuln-lab"
      "log_type" => "attack-detection"
    }
  }

  # Drop empty or test events
  if [attack_type] == "test" or [attack_type] =~ /healthcheck/ {
    drop { }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "attack-logs-%{+YYYY.MM.dd}"
    template_name => "attack-logs-template"
    template => "/etc/logstash/templates/elasticsearch_template.json"
    template_overwrite => true
    user => "${ES_USER:elastic}"
    password => "${ES_PASSWORD:changeme}"
    ssl => false
    ssl_certificate_verification => false
  }

  # Debug output (optional - comment out in production)
  # stdout {
  #   codec => rubydebug
  # }

  # Dead letter queue for failed events
  if [@metadata][dead_letter_queue] {
    file {
      path => "/var/log/logstash/dead_letter/%{+YYYY-MM-dd}.log"
      codec => json_lines
    }
  }
}
