upstream vuln_lab {
    server vuln-lab:5017;
}

limit_req_zone $binary_remote_addr zone=vuln:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    location / {
        limit_req zone=vuln burst=20 nodelay;
        proxy_pass http://vuln_lab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
