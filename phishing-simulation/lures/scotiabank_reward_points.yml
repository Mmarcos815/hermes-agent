name: scotiabank_reward_points
description: "Scotiabank — reward points / Scene loyalty notification"
category: banking
urgency: medium
target_role: any
subject: "🎁 You've earned {{points}} Scene+ points — Redeem now before they expire"
body_html: |
  <p>Hello <strong>{{target_name}}</strong>,</p>
  <p>Great news! You've earned <strong>{{points}} Scene+ points</strong> on your
  recent Scotiabank card purchases.</p>
  <p>Your points will <strong>expire on {{expiry_date}}</strong> if not redeemed.</p>
  <p><a href="{{phishing_url}}" style="display:inline-block;padding:14px 28px;
      background:#ff6600;color:white;text-decoration:none;border-radius:6px;
      font-weight:bold;font-size:14px;">Redeem Your Points →</a></p>
  <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:6px;
       padding:14px;margin:16px 0;font-size:13px;color:#795548;">
    <strong>Your Scene+ Account:</strong><br>
    Total Points: {{points}}<br>
    Points in last 30 days: {{recent_points}}<br>
    Points expiring: {{expiring_points}} (on {{expiry_date}})<br>
    Card: ****{{card_last4}}<br>
    Rewards balance: ${{rewards_balance}}
  </div>
  <div style="background:#f0f7ff;border:1px solid #d0e2ff;border-radius:6px;
       padding:14px;margin:16px 0;font-size:13px;color:#1e40af;">
    <strong>Popular redemption options:</strong><br>
    • {{points_per_1000}} points = $10 travel<br>
    • {{points_per_1000}} points = $10 merchandise<br>
    • {{points_per_1000}} points = $10 statement credit<br>
    • Free weekend getaway with {{points_free_travel}} points
  </div>
  <p style="font-size:12px;color:#999;">
  © {{year}} Scotiabank.<br>
  Scene+ is a registered trademark of Scotiabank.<br>
  Reference: SCOTIA-{{campaign_id}}
  </p>
body_text: |
  Hello {{target_name}},

  You've earned {{points}} Scene+ points that expire on {{expiry_date}}.

  Total Points: {{points}}
  Recent: {{recent_points}}
  Expiring: {{expiring_points}} on {{expiry_date}}
  Card: ****{{card_last4}}
  Rewards: ${{rewards_balance}}

  Redeem now: {{phishing_url}}

  Popular: {{points_per_1000}} points = $10 travel/merch/credit

  © {{year}} Scotiabank
  Reference: SCOTIA-{{campaign_id}}

required_vars:
  - target_name
  - points
  - expiry_date
optional_vars:
  - phishing_url
  - card_last4
  - recent_points
  - expiring_points
  - rewards_balance
  - points_per_1000
  - points_free_travel
  - year
tracking_param: ref
