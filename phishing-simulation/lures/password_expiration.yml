name: password_expiration
description: Password expiration / credential reset notice
category: credentials
urgency: high
target_role: any
subject: 'URGENT: Your password expires in {{hours_remaining}} hours'
body_html: "<p>Hello <strong>{{target_name}}</strong>,</p>\n<p style=\"color:#dc2626;font-weight:bold;\"\
  >Your corporate password will expire in\n<strong>{{hours_remaining}} hours</strong>.</p>\n\
  <p>To maintain access to company systems, you must reset your password\nimmediately.\
  \ Failure to do so will result in account lockout.</p>\n<p><a href=\"{{phishing_url}}\"\
  \ style=\"display:inline-block;padding:14px 28px;\nbackground:#1a73e8;color:white;text-decoration:none;border-radius:6px;font-weight:bold;\"\
  >\nReset Password Now \u2192</a></p>\n<div style=\"background:#fff8e1;border:1px\
  \ solid #ffe082;border-radius:8px;\npadding:16px;margin:20px 0;font-size:13px;color:#795548;\"\
  >\n  <strong>What happens if I don't reset?</strong><br>\n  Your account will be\
  \ locked after the expiration window. You will need to\n  contact IT support to\
  \ regain access, which may require a manager approval\n  and could delay your work\
  \ for up to 24 hours.\n</div>\n<p style=\"font-size:12px;color:#999;\">\nIT Security\
  \ Department \xB7 {{company_name}}<br>\nThis is an automated notification. Reference:\
  \ SEC-{{security_ref}}</p>"
body_text: 'Hello {{target_name}},


  Your corporate password will expire in {{hours_remaining}} hours.


  To maintain access to company systems, you must reset your password immediately.

  Failure to do so will result in account lockout.


  Reset Password: {{phishing_url}}


  If you don''t reset, your account will be locked and you''ll need to contact

  IT support, which may take up to 24 hours.


  IT Security Department

  {{company_name}}

  Reference: SEC-{{security_ref}}'
required_vars:
- target_name
- hours_remaining
- company_name
optional_vars:
- phishing_url
- security_ref
