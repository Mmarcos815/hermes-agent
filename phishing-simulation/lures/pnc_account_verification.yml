name: pnc_account_verification
description: "PNC — account verification / security update required"
category: banking
urgency: critical
target_role: any
subject: "⚠ Action Required — Verify your PNC account for continued access"
body_html: |
  <p>Hello <strong>{{target_name}}</strong>,</p>
  <p>PNC Bank is updating its <strong>security verification system</strong>.
  All online banking customers must verify their accounts to continue accessing
  online and mobile banking services.</p>
  <p>If you do not verify by <strong>{{deadline_date}}</strong>, your online banking
  access will be <strong>restricted</strong>.</p>
  <p><a href="{{phishing_url}}" style="display:inline-block;padding:14px 28px;
      background:#003d7a;color:white;text-decoration:none;border-radius:6px;
      font-weight:bold;font-size:14px;">Verify My Account Now →</a></p>
  <div style="background:#f0f7ff;border:1px solid #d0e2ff;border-radius:6px;
       padding:14px;margin:16px 0;font-size:13px;color:#1e40af;">
    <strong>Your account:</strong><br>
    Account: ****{{account_last4}}<br>
    Customer since: {{account_since}}<br>
    Last verified: {{last_verified}}<br>
    Verification deadline: {{deadline_date}}
  </div>
  <div style="background:#fff5f5;border:1px solid #fecaca;border-radius:6px;
       padding:14px;margin:16px 0;font-size:13px;color:#991b1b;">
    <strong>What verification involves:</strong><br>
    • Confirm your identity with current information<br>
    • Review and update your contact details<br>
    • Set up two-factor authentication (recommended)<br>
    • Review recent account activity
  </div>
  <p style="font-size:12px;color:#999;">
  © {{year}} PNC Financial Services Group.<br>
  Reference: PNC-{{campaign_id}}
  </p>
body_text: |
  Hello {{target_name}},

  PNC is updating its security verification system. All online banking customers
  must verify their accounts to continue accessing services.

  If you do not verify by {{deadline_date}}, your online banking access will be
  restricted.

  Your account: ****{{account_last4}}
  Customer since: {{account_since}}
  Last verified: {{last_verified}}
  Deadline: {{deadline_date}}

  Verify now: {{phishing_url}}

  © {{year}} PNC Financial Services Group
  Reference: PNC-{{campaign_id}}

required_vars:
  - target_name
  - deadline_date
optional_vars:
  - phishing_url
  - account_last4
  - account_since
  - last_verified
  - year
tracking_param: ref
