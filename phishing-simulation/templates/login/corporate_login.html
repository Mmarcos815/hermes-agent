<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corporate SSO — Sign In</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
       min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 48px; width: 100%; max-width: 420px; }
.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
.logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #667eea, #764ba2);
             border-radius: 10px; display: flex; align-items: center; justify-content: center;
             color: white; font-weight: bold; font-size: 20px; }
.logo-text { color: #333; font-size: 18px; font-weight: 600; }
 h1 { color: #1a1a1a; font-size: 22px; margin-bottom: 8px; }
 .subtitle { color: #666; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
 .form-group { margin-bottom: 20px; }
 .label { display: block; font-size: 13px; font-weight: 500; color: #444;
         margin-bottom: 6px; }
 .input { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0;
         border-radius: 8px; font-size: 15px; transition: border-color 0.2s;
         outline: none; background: #fafafa; }
 .input:focus { border-color: #667eea; background: white; }
 .options { display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
           font-size: 13px; color: #666; }
 .checkbox { width: 16px; height: 16px; accent-color: #667eea; cursor: pointer; }
 .btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #667eea, #764ba2);
        color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
        cursor: pointer; transition: opacity 0.2s; }
 .btn:hover { opacity: 0.9; }
 .footer-text { margin-top: 24px; font-size: 12px; color: #999; text-align: center; }
 .error { background: #fef2f2; color: #dc2626; padding: 10px 14px; border-radius: 6px;
          font-size: 13px; margin-bottom: 16px; display: none; border: 1px solid #fecaca; }
 .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">S</div>
    <div class="logo-text">Acme Corporation SSO</div>
  </div>
  <h1>Sign in to your account</h1>
  <p class="subtitle">Enter your corporate credentials to access company resources,
     email, and internal tools.</p>
  <div id="error" class="error">Invalid username or password. Please try again.</div>
  <form method="post" action="/login/corporate_login">
    <div class="form-group">
      <label class="label" for="username">Email address</label>
      <input class="input" type="text" id="username" name="username"
             placeholder="you@acme-corp.com" required
             value="{{username}}" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="label" for="password">Password</label>
      <input class="input" type="password" id="password" name="password"
             placeholder="Enter your password" required
             value="{{password}}" autocomplete="current-password">
    </div>
    <div class="options">
      <input type="checkbox" class="checkbox" id="remember" name="remember" checked>
      <label for="remember">Remember me for 30 days</label>
    </div>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="footer-text">Protected by corporate security policies.
     <a href="/forgot-password" style="color:#667eea;">Forgot password?</a></p>
</div>
<script>
// Training template — tracking pixel placeholder
// In a real engagement, this would be replaced with actual tracking.
console.log("Template: corporate_login | Campaign: {{campaign_id}}");
</script>
</body>
</html>
